{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIGEB - {{ titulo_pagina }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-canvas: #f2f5fa;
            --primary-dark: #12193b;
            --accent-orange: #ff7300;
            --card-shadow: 0 10px 30px rgba(0, 0, 0, 0.03);
        }

        body {
            background-color: var(--bg-canvas);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            color: #334155;
            min-height: 100vh;
        }

        .sidebar {
            width: 250px;
            background-color: var(--primary-dark);
            border-radius: 20px;
            position: fixed;
            top: 20px;
            bottom: 20px;
            left: 20px;
            padding: 24px;
            z-index: 1000;
        }

        .nav-link-custom {
            color: #94a3b8;
            border-radius: 12px;
            padding: 12px 16px;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .nav-link-custom:hover {
            color: #ffffff;
            background-color: rgba(255, 255, 255, 0.08);
        }

        .main-content {
            margin-left: 290px;
            padding: 20px 30px 40px 10px;
        }

        .custom-card {
            background-color: #ffffff;
            border-radius: 20px;
            border: none;
            box-shadow: var(--card-shadow);
            padding: 30px;
        }

        label {
            font-weight: 600;
            color: #475569;
            margin-bottom: 6px;
            font-size: 0.9rem;
        }

        .form-control, .form-select {
            border-radius: 10px;
            padding: 10px 14px;
            border: 1px solid #e2e8f0;
            background-color: #f8fafc;
        }

        .form-control:focus, .form-select:focus {
            background-color: #ffffff;
            border-color: var(--accent-orange);
            box-shadow: 0 0 0 0.25rem rgba(255, 115, 0, 0.15);
        }
    </style>
</head>
<body>

    <!-- SIDEBAR FLOTANTE -->
    <div class="sidebar shadow">
        <div class="d-flex align-items-center gap-3 px-2 mb-4">
            <div class="bg-white p-2 rounded-3">
                <img src="{% static 'icon-equipos-medicos.png' %}" width="28" alt="Logo">
            </div>
            <h5 class="mb-0 fw-bold fs-5 text-white">SIGEB</h5>
        </div>
        <hr class="border-secondary opacity-25">
        <div class="d-flex flex-column gap-2 mt-3">
            <a href="{% url 'lista_equipos' %}" class="nav-link-custom"><i class="fa-solid fa-chart-pie"></i> Dashboard</a>
            <a href="{% url 'inventario' %}" class="nav-link-custom"><i class="fa-solid fa-stethoscope"></i> Inventario</a>
            <a href="{% url 'mantenimientos' %}" class="nav-link-custom"><i class="fa-solid fa-screwdriver-wrench"></i> Mantenimiento</a>
            <a href="{% url 'incidencias' %}" class="nav-link-custom"><i class="fa-solid fa-triangle-exclamation"></i> Incidencias</a>
            <a href="/admin/" class="nav-link-custom mt-4 text-warning"><i class="fa-solid fa-user-gear"></i> Administrador</a>
        </div>
    </div>

    <!-- CONTENIDO PRINCIPAL -->
    <div class="main-content">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h3 class="fw-bold mb-0 text-dark">{{ titulo_pagina }}</h3>
                <p class="text-muted small mb-0">{{ subtitulo }}</p>
            </div>
            <a href="javascript:history.back()" class="btn btn-outline-secondary rounded-pill px-4 fw-semibold">
                <i class="fa-solid fa-arrow-left me-1"></i> Volver
            </a>
        </div>

        <div class="custom-card">
            <form method="POST" enctype="multipart/form-data">
                {% csrf_token %}
                <div class="row g-3">
                    {% for field in form %}
                    <div class="col-md-6 mb-2">
                        <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                        {{ field }}
                        {% if field.errors %}
                            <div class="text-danger small mt-1">{{ field.errors.0 }}</div>
                        {% endif %}
                    </div>
                    {% endfor %}
                </div>

                <div class="d-flex justify-content-end gap-2 mt-4 pt-3 border-top">
                    <a href="javascript:history.back()" class="btn btn-light rounded-pill px-4">Cancelar</a>
                    <button type="submit" class="btn text-white rounded-pill px-4 fw-semibold" style="background-color: var(--accent-orange);">
                        <i class="fa-solid fa-floppy-disk me-1"></i> Guardar Registro
                    </button>
                </div>
            </form>
        </div>
    </div>

</body>
</html>
